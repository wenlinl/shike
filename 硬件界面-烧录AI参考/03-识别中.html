<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>食刻 · 硬件界面 03 识别中 (240×320)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:240px;height:320px;overflow:hidden;background:#222c1c;font-family:"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.cam-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,#4a5740 0%,#2d3826 62%,#222c1c 100%)}
.cam-bg::after{content:"";position:absolute;inset:0;background:rgba(20,26,15,.42)}
.tag-top{position:absolute;top:18px;left:50%;transform:translateX(-50%);background:rgba(63,127,80,.85);color:#fff;font-size:11px;padding:5px 12px;border-radius:999px;white-space:nowrap;z-index:3}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;z-index:3}
.ring{width:46px;height:46px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.center .t1{font-size:21px;font-weight:800}
.center .t2{font-size:11px;opacity:.85}
.spec-btn{position:absolute;top:4px;right:4px;z-index:30;width:18px;height:18px;border-radius:50%;border:0;background:rgba(255,255,255,.45);color:#fff;font-size:11px;font-weight:700;line-height:18px;cursor:pointer}
.spec{display:none;position:absolute;inset:0;z-index:40;background:rgba(248,241,233,.985);padding:20px 12px 28px;font-size:11.5px;color:#5f4f42;line-height:1.65;overflow:auto}
.spec.open{display:block}
.spec h2{font-size:13px;color:#50382b;margin-bottom:4px}
.spec table{border-collapse:collapse;width:100%;margin-top:6px}
.spec td,.spec th{border:1px solid #e2d5c5;padding:4px 6px;text-align:left;font-size:10.5px;vertical-align:top}
.spec th{background:#f6ede2}
.spec code{background:#f6ede2;padding:0 3px;border-radius:4px}
.spec-close{position:absolute;top:8px;right:10px;border:0;background:#f6ede2;width:22px;height:22px;border-radius:50%;font-size:13px;cursor:pointer;color:#50382b}
</style>
</head>
<body>
<div class="screen">
  <div class="cam-bg"></div>
  <div class="tag-top">✓ 照片已上传</div>
  <div class="center">
    <div class="ring"></div>
    <div class="t1">正在识别…</div>
    <div class="t2">云端 AI 解析中</div>
  </div>
  <button class="spec-btn" onclick="document.getElementById('spec').classList.toggle('open')">i</button>
</div>
<div class="spec" id="spec">
  <button class="spec-close" onclick="document.getElementById('spec').classList.remove('open')">×</button>
  <h2>实现说明（给烧录 AI）</h2>
  固件状态：<b>RECOGNIZING</b>。照片上传成功后停留本页，等待 <code>POST /api/scan</code> 响应。
  <table>
    <tr><th>元素</th><th>规格</th></tr>
    <tr><td>背景</td><td>最近一帧摄像头画面 + 42% 黑色遮罩（示意：静态时保留最后一帧，无装饰物）</td></tr>
    <tr><td>顶部标签</td><td>绿色胶囊：✓ 照片已上传</td></tr>
    <tr><td>加载圈</td><td>46px 圆环，白色 25% 底 + 白色旋转头，1s/圈</td></tr>
    <tr><td>超时</td><td>15s 无响应 → 07-网络错误页（动作保留，可重试）</td></tr>
    <tr><td>成功</td><td>code==0 且 confidence≥0.5 → 04/05-识别结果页</td></tr>
  </table>
</div>
</body>
</html>
