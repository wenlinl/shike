name: k230-rawfood-resnet50-convert

on:
  push:
    branches: [codex/rawfood-k230]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch output branch
        run: git fetch origin codex/rawfood-out || true

      - name: Install toolchain (torch CPU + nncase 2.11.0)
        run: |
          set +e
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu > ci_step.log 2>&1
          pip install -q onnx onnxscript onnxsim pillow numpy nncase==2.11.0 nncase-kpu==2.11.0 >> ci_step.log 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then bash k230-convert/ci_push_status.sh FAIL_INSTALL ci_step.log; exit $rc; fi
          bash k230-convert/ci_push_status.sh OK_INSTALL

      - name: Download raw-food ResNet-50 weights
        run: |
          set +e
          for u in \
            "https://hf-mirror.com/ibrahimdaud/raw-food-recognition-models/resolve/main/resnet50_pytorch_model.bin" \
            "https://huggingface.co/ibrahimdaud/raw-food-recognition-models/resolve/main/resnet50_pytorch_model.bin" ; do
            echo "try $u" > ci_step.log
            curl -fsSL --retry 5 --retry-delay 5 -C - -o resnet50_pytorch_model.bin "$u" >> ci_step.log 2>&1 && break
          done
          ls -l resnet50_pytorch_model.bin >> ci_step.log 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then bash k230-convert/ci_push_status.sh FAIL_DOWNLOAD ci_step.log; exit $rc; fi
          bash k230-convert/ci_push_status.sh OK_DOWNLOAD

      - name: Export ONNX (ResNet-50, 90 classes, 224x224)
        run: |
          set +e
          python k230-convert/export_rawfood_resnet50_onnx.py \
            resnet50_pytorch_model.bin rawfood_resnet50_224.onnx > ci_step.log 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then bash k230-convert/ci_push_status.sh FAIL_EXPORT ci_step.log; exit $rc; fi
          bash k230-convert/ci_push_status.sh OK_EXPORT

      - name: Compile kmodel (nncase 2.11.0, INT8 PTQ, ImageNet mean/std baked in)
        run: |
          set +e
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 7.0 --runtime dotnet --install-dir "$HOME/.dotnet7" > ci_step.log 2>&1
          export DOTNET_ROOT="$HOME/.dotnet7"
          export PATH="$HOME/.dotnet7:$PATH"
          python k230-convert/onnx2kmodel_k230.py \
            rawfood_resnet50_224.onnx rawfood_resnet50_224.kmodel \
            --random-calib 100 \
            --input-range 0,1 \
            --mean 0.485,0.456,0.406 \
            --std 0.229,0.224,0.225 >> ci_step.log 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then bash k230-convert/ci_push_status.sh FAIL_COMPILE ci_step.log; exit $rc; fi
          bash k230-convert/ci_push_status.sh OK_COMPILE

      - name: Publish kmodel to output branch
        run: |
          bash k230-convert/ci_push_status.sh DONE
          blob1=$(git hash-object -w ci_status.txt)
          blob2=$(git hash-object -w rawfood_resnet50_224.kmodel)
          blob3=$(git hash-object -w rawfood_resnet50_224.onnx)
          tree=$(printf '100644 blob %s\tci_status.txt\n100644 blob %s\trawfood_resnet50_224.kmodel\n100644 blob %s\trawfood_resnet50_224.onnx\n' "$blob1" "$blob2" "$blob3" | git mktree)
          if parent=$(git rev-parse --verify refs/remotes/origin/codex/rawfood-out 2>/dev/null); then
            commit=$(git commit-tree "$tree" -p "$parent" -m "ci: kmodel ready")
          else
            commit=$(git commit-tree "$tree" -m "ci: kmodel ready")
          fi
          git push origin "$commit":refs/heads/codex/rawfood-out
          echo PUBLISHED "$commit"
